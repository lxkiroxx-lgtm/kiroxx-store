
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIROXX STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#171717;font-family:Arial,sans-serif}
header{background:#111;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;letter-spacing:2px}
.hero{background:linear-gradient(135deg,#171717,#45405c);color:white;text-align:center;padding:65px 20px}
.hero h1{font-size:38px;margin:0 0 12px}
.hero p{color:#ddd}
button{background:#171717;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}
.search{display:block;width:90%;max-width:500px;margin:25px auto;padding:14px;border:1px solid #ccc;border-radius:8px}
h2{text-align:center;margin-top:35px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px;padding:18px;max-width:900px;margin:auto}
.card{background:white;padding:14px;border-radius:12px;text-align:center;box-shadow:0 2px 10px #0001}
.product-image{font-size:65px;background:#eee;border-radius:10px;padding:20px}
.price{font-weight:bold;font-size:19px}
.card button{width:100%}
#cart{margin:20px;padding:18px;background:white;border-radius:10px}
footer{text-align:center;background:#111;color:white;padding:25px;margin-top:35px}
</style>
</head>
<body>
<header>
<div class="logo">KIROXX STORE</div>
<div>🛒 Cart: <span id="count">0</span></div>
</header>
<section class="hero">
<h1>WELCOME TO KIROXX</h1>
<p>Discover products you'll love.</p>
<button onclick="document.getElementById('products').scrollIntoView()">SHOP NOW</button>
</section>
<input class="search" id="search" placeholder="Search products..." oninput="filterProducts()">
<h2>OUR PRODUCTS</h2>
<div class="products" id="products">
<div class="card" data-name="wireless earbuds">
<div class="product-image">🎧</div>
<h3>Wireless Earbuds</h3>
<p class="price">₹1,499</p>
<button onclick="add('Wireless Earbuds',1499)">Add to Cart</button>
</div>
<div class="card" data-name="smart watch">
<div class="product-image">⌚</div>
<h3>Smart Watch</h3>
<p class="price">₹1,999</p>
<button onclick="add('Smart Watch',1999)">Add to Cart</button>
</div>
<div class="card" data-name="headphones">
<div class="product-image">🎧</div>
<h3>Headphones</h3>
<p class="price">₹999</p>
<button onclick="add('Headphones',999)">Add to Cart</button>
</div>
</div>
<div id="cart">
<h2>Your Cart</h2>
<div id="items">Your cart is empty.</div>
<h3 id="total">Total: ₹0</h3>
</div>
<footer>
<h3>KIROXX STORE</h3>
<p>Thank you for shopping with us!</p>
<p>Contact: Add your business email here</p>
</footer>
<script>
let cart=[];
function add(name,price){
cart.push({name,price});
document.getElementById('count').textContent=cart.length;
document.getElementById('items').innerHTML=cart.map((p,i)=>`${p.name} - ₹${p.price} <button onclick="removeItem(${i})">Remove</button>`).join('<br><br>');
document.getElementById('total').textContent='Total: ₹'+cart.reduce((s,p)=>s+p.price,0);
}
function removeItem(i){
cart.splice(i,1);
document.getElementById('count').textContent=cart.length;
document.getElementById('items').innerHTML=cart.length?cart.map((p,i)=>`${p.name} - ₹${p.price} <button onclick="removeItem(${i})">Remove</button>`).join('<br><br>'):'Your cart is empty.';
document.getElementById('total').textContent='Total: ₹'+cart.reduce((s,p)=>s+p.price,0);
}
function filterProducts(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>c.style.display=c.dataset.name.includes(q)?'block':'none');
}
</script>
</body>
  </html>
